services:
  api:
    build: ./php
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

